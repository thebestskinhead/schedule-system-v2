name: Build & Release

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'
  PROJECT_NAME: schedule-system-v2

jobs:
  # ------------------------------------------------------------------
  # 构建：产出 Linux 全量包与 Windows 单端包
  # ------------------------------------------------------------------
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史：供下一步 git describe 定位最近的版本标签
          fetch-depth: 0

      - name: Resolve version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # tag 推送：版本号即标签（release 的唯一来源）
            VERSION="${GITHUB_REF_NAME}"
          else
            # 分支推送 / PR / 手动触发：最近的 v*.*.* 标签 + dev + 短 sha。
            # 语义化版本比较下预发布版低于正式版（见 backend/internal/update/version.go），
            # 因此 dev 产物部署后仍能收到将来正式版的更新。
            LATEST=$(git describe --tags --match 'v*.*.*' --abbrev=0 2>/dev/null || echo "v0.0.0")
            VERSION="${LATEST}-dev+${GITHUB_SHA::7}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "构建版本号: ${VERSION}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend-v2/package-lock.json
            frontend-mobile/package-lock.json

      - name: Backend tests
        working-directory: backend
        run: go test ./... -count=1

      - name: Frontend tests (vitest)
        working-directory: frontend-v2
        run: |
          npm ci
          npm test

      - name: Build desktop frontend
        working-directory: frontend-v2
        run: |
          npm ci
          npm run build

      - name: Build mobile frontend
        working-directory: frontend-mobile
        run: |
          npm ci
          npm run build

      # ---------- Linux 全量包 ----------
      - name: Build Linux binary
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../release-linux/server ./cmd/server/main.go

      - name: Build Linux updater
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../release-linux/update ./cmd/updater/main.go

      - name: Assemble Linux package
        run: |
          chmod +x .github/scripts/package.sh
          TARGET=linux VERSION="${{ env.VERSION }}" bash .github/scripts/package.sh

      - name: Archive Linux package
        run: |
          tar -czf "${PROJECT_NAME}-linux-amd64.tar.gz" -C release-linux .
          ls -lh "${PROJECT_NAME}-linux-amd64.tar.gz"

      # ---------- Windows 单端包 ----------
      - name: Build Windows binary
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../release-windows/server.exe ./cmd/server/main.go

      - name: Build Windows updater
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../release-windows/update.exe ./cmd/updater/main.go

      - name: Assemble Windows package
        run: |
          chmod +x .github/scripts/package.sh
          TARGET=windows VERSION="${{ env.VERSION }}" bash .github/scripts/package.sh

      - name: Archive Windows package
        run: |
          cd release-windows && zip -r "../${PROJECT_NAME}-windows-amd64.zip" .
          cd .. && ls -lh "${PROJECT_NAME}-windows-amd64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ github.sha }}
          path: |
            ${{ env.PROJECT_NAME }}-linux-amd64.tar.gz
            ${{ env.PROJECT_NAME }}-windows-amd64.zip
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------
  # 发布：仅在 v*.*.* 标签推送时，把产物挂到 GitHub Release
  # ------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ github.sha }}
          path: dist-artifacts

      - name: List artifacts
        run: ls -lh dist-artifacts

      # 生成 sha256 校验文件（update.exe 下载后会据此校验安装包完整性）
      - name: Generate checksums
        run: |
          cd dist-artifacts
          sha256sum "${PROJECT_NAME}-linux-amd64.tar.gz" > "${PROJECT_NAME}-linux-amd64.tar.gz.sha256"
          sha256sum "${PROJECT_NAME}-windows-amd64.zip" > "${PROJECT_NAME}-windows-amd64.zip.sha256"
          cat *.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-artifacts/${{ env.PROJECT_NAME }}-linux-amd64.tar.gz
            dist-artifacts/${{ env.PROJECT_NAME }}-linux-amd64.tar.gz.sha256
            dist-artifacts/${{ env.PROJECT_NAME }}-windows-amd64.zip
            dist-artifacts/${{ env.PROJECT_NAME }}-windows-amd64.zip.sha256
          fail_on_unmatched_files: true
